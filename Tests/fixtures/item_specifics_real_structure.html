<div class="smry summary__attributes">
  <div class="summary__attributes--container">
    <div class="summary__attributes--fields summary__attributes--field" data-testid="attribute">
      <div class="summary__attributes--label required-field"><button id="item-specific-dropdown-label-0">Brand</button></div>
      <div class="summary__attributes--value"><button name="attributes.Brand" aria-expanded="false" aria-controls="brand-menu"><span class="se-expand-button__button-text"></span></button><div id="brand-menu" class="fake-menu-button__menu"><input name="search-box-attributesBrand"><div role="menuitemradio" aria-checked="false"><span>Eileen Fisher</span></div></div></div>
    </div>
    <div class="summary__attributes--fields summary__attributes--field" data-testid="attribute">
      <div class="summary__attributes--label"><button id="item-specific-dropdown-label-1">Features</button></div>
      <div class="summary__attributes--value"><button name="attributes.Features" aria-expanded="false" aria-controls="features-menu"><span class="se-expand-button__button-text">Pockets</span></button><div id="features-menu" class="fake-menu-button__menu"><input name="search-box-attributesFeatures"><div role="menuitemcheckbox" aria-checked="true"><span class="filter-menu__text">Pockets</span></div><div role="menuitemcheckbox" aria-checked="false"><span class="filter-menu__text">Breathable</span></div></div></div>
    </div>
    <div class="summary__attributes--fields summary__attributes--field" data-testid="attribute">
      <div class="summary__attributes--label"><button id="item-specific-dropdown-label-2">Vintage</button></div>
      <div class="summary__attributes--value"><ul aria-label="Vintage"><li><button aria-pressed="false">Yes</button></li><li><button aria-pressed="true">No</button></li></ul></div>
    </div>

    <div class="summary__attributes--fields summary__attributes--field" data-testid="attribute">
      <div class="summary__attributes--label"><button id="item-specific-dropdown-label-3">Front Type</button></div>
      <div class="summary__attributes--value"><ul aria-label="Front Type"><li><button aria-pressed="true">Flat Front</button></li><li><button aria-pressed="false">Pleated</button></li></ul></div>
    </div>
    <div class="summary__attributes--fields summary__attributes--inline-input-field" data-testid="attribute">
      <label class="field__label" for="upc">UPC</label><input id="upc" name="universalProductCode">
    </div>
  </div>
</div>
