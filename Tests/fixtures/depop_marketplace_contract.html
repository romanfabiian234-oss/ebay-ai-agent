<!doctype html><html><body>
<form aria-label="List an item">
  <input id="upload-input__input" aria-label="Add a photo" type="file" multiple accept="image/jpeg,image/png">
  <label for="description">Description</label><textarea id="description"></textarea>
  <div class="field"><label id="group-label" for="group-input">Category</label><input id="group-input" role="combobox" aria-controls="group-menu" aria-expanded="false"><ul id="group-menu" role="listbox"><div><p>Women &gt; Accessories</p><li id="group-item-0" role="option" aria-selected="false">Bags</li></div></ul></div>
  <div class="field"><label for="brand-input">Brand</label><input id="brand-input" role="combobox" aria-controls="brand-menu"><ul id="brand-menu" role="listbox"><li role="option">kate spade new york</li></ul></div>
  <div class="field"><label for="condition-input">Condition</label><input id="condition-input" role="combobox" aria-controls="condition-menu"><ul id="condition-menu" role="listbox"><li role="option">Used - Excellent</li></ul></div>
  <div class="field"><label for="colour-input">Color</label><input id="colour-input" role="combobox" aria-controls="colour-menu"><ul id="colour-menu" role="listbox"><li role="option">Pink</li></ul><p>Select up to two colors</p></div>
  <div class="field"><label for="source-input">Source</label><input id="source-input" role="combobox" aria-controls="source-menu"><ul id="source-menu" role="listbox"><li role="option">Preloved</li></ul><p>Add up to 2</p></div>
  <div class="field"><label for="age-input">Age</label><input id="age-input" role="combobox" aria-controls="age-menu"><ul id="age-menu" role="listbox"><li role="option">Modern</li></ul><p>Add up to 1</p></div>
  <div class="field"><label for="style-input">Style</label><input id="style-input" role="combobox" aria-controls="style-menu"><ul id="style-menu" role="listbox"><li role="option">Minimalist</li></ul></div>
  <label for="priceAmount__input">Item price</label><input id="priceAmount__input">
  <label for="shippingMethods-input">Package size</label><input id="shippingMethods-input" role="combobox" aria-controls="shippingMethods-menu">
  <button type="submit">Post listing</button>
</form>
</body></html>
