<!doctype html><html><body><div id="content">
<div class="card card--large"><h1>Create Listing</h1>
<section class="listing-editor__section"><div class="listing-editor__subsection"><div class="listing-editor__section__title">Photos &amp; Video</div><input id="img-file-input" aria-label="img-file-input" type="file" multiple></div></section>
<section class="listing-editor__section"><div class="listing-editor__subsection"><div class="listing-editor__section__title">Category *</div><div class="listing-editor__category-container"><div data-test="dropdown"><div data-test="dropdown-container"><div class="dropdown__selector">Select Category</div></div><div class="dropdown__menu"><a class="dropdown__link dropdown__menu__item" data-et-name="women">Women</a><a class="dropdown__link dropdown__menu__item" data-et-name="men">Men</a></div></div></div><div class="listing-editor__subcategory-container"><div data-test="dropdown"><div data-test="dropdown-container"><div class="dropdown__selector">Select Subcategory (optional)</div></div><div class="dropdown__menu"><a class="dropdown__link dropdown__menu__item">Bags</a></div></div></div></div></section>
<section class="listing-editor__section"><div class="listing-editor__subsection"><div class="listing-editor__section__title">Size</div><div data-test="dropdown"><div data-test="dropdown-container"><div data-test="size" class="dropdown__selector">Select Size</div></div><div class="dropdown__menu"><div class="dropdown__menu__item"><div class="dropdown__link">One Size</div></div></div></div></div></section>
<section class="listing-editor__section"><div class="listing-editor__subsection"><div class="listing-editor__section__title">condition</div><div data-test="dropdown"><div data-test="dropdown-container"><div class="dropdown__selector">Select Condition</div></div><ul data-test="dropdown_menu_list" class="dropdown__menu"><li class="dropdown__menu__item"><div data-et-name="listing_condition" class="dropdown__link"><div class="fw--med">Good</div><div>Gently used</div></div></li></ul></div></div></section>
<section class="listing-editor__section"><div class="listing-editor__subsection"><div class="listing-editor__section__title">Brand</div><div data-et-name="listingEditorBrandSection"><input placeholder="Enter the Brand/Designer"><div class="dropdown__menu"><div class="dropdown__menu__item"><div class="dropdown__link">kate spade new york</div></div></div></div></div></section>
<section class="listing-editor__section"><div class="listing-editor__subsection"><div class="listing-editor__section__title">Color</div><div data-test="dropdown"><div data-test="dropdown-container"><div class="dropdown__selector">Select up to 2 colors</div></div><div class="dropdown__menu"><ul><li class="listing-editor__tile--color"><span>Pink</span></li></ul><button>Done</button></div></div></div></section>
<section class="listing-editor__section"><div class="listing-editor__subsection"><div class="listing-editor__section__title">Style Tags</div><div class="listing-editor__tags__container"><input data-vv-name="style-tag-input" placeholder="Add up to 3 tags"></div><ul class="dropdown__menu"><li class="dropdown__menu__item"><div class="dropdown__link"><div data-et-name="Minimalist" data-et-on-name="style_tag">Minimalist</div></div></li></ul></div></section>
<section class="listing-editor__section"><div class="listing-editor__subsection"><div class="listing-editor__section__title">Availability *</div><div data-et-name="listingEditorAvailabilitySection"><button>For Sale</button></div></div></section>
<button>List This Item</button><button>Delete Listing</button>
</div></div></body></html>
